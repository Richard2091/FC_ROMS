name: 发布游戏库 Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manifest.v1.json"
      - "search-index.v1.json"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "fc-roms-pages"
  cancel-in-progress: true

jobs:
  build:
    name: 生成页面
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 生成首页
        run: |
          mkdir -p public
          cp manifest.v1.json search-index.v1.json public/
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>红白机游戏库</title>
            </head>
            <body>
              <h1>红白机游戏库</h1>
              <p>面向 Retro Hall 客户端的在线游戏库清单。</p>
              <ul>
                <li><a href="manifest.v1.json">游戏清单</a></li>
                <li><a href="search-index.v1.json">搜索索引</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: 发布 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4