name: 鍙戝竷娓告垙搴?Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manifest.v1.json"
      - "search-index.v1.json"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "fc-roms-pages"
  cancel-in-progress: true

jobs:
  build:
    name: 鐢熸垚椤甸潰
    runs-on: ubuntu-latest
    steps:
      - name: 妫€鍑轰唬鐮?        uses: actions/checkout@v4

      - name: 閰嶇疆 Pages
        uses: actions/configure-pages@v5

      - name: 鐢熸垚棣栭〉
        run: |
          mkdir -p public
          cp manifest.v1.json search-index.v1.json public/
          cat > public/index.html <<'EOF'
          <!doctype html>
          <html lang="zh-CN">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>绾㈢櫧鏈烘父鎴忓簱</title>
            </head>
            <body>
              <h1>绾㈢櫧鏈烘父鎴忓簱</h1>
              <p>闈㈠悜 Retro Hall 瀹㈡埛绔殑鍦ㄧ嚎娓告垙搴撴竻鍗曘€?/p>
              <ul>
                <li><a href="manifest.v1.json">娓告垙娓呭崟</a></li>
                <li><a href="search-index.v1.json">鎼滅储绱㈠紩</a></li>
              </ul>
            </body>
          </html>
          EOF

      - name: 涓婁紶 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: 鍙戝竷 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 閮ㄧ讲鍒?GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4