name: 发布游戏库 Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "manifest.v1.json"
      - "search-index.v1.json"
      - "zh-metadata.v1.json"
      - "cover-source.v1.json"
      - "ROM/**/cover.webp"
      - "ROM/**/screenshot.webp"
      - "tools/generate_pages.py"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "fc-roms-pages"
  cancel-in-progress: true

jobs:
  build:
    name: 生成页面
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 生成首页
        run: |
          python tools/generate_pages.py --output public

      - name: 上传 Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: 发布 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
